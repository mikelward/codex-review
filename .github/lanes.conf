# Ordered: the FIRST matching rule wins, and anything matching no rule is code.
#
# The lane's test is "can this change what the action does?". Markdown here
# is documentation — describing behavior rather than producing it — except
# where the suite READS it, which is the trap the lanes README warns every
# consumer about: a docs-only skip on a file a test asserts against lets the
# edit that breaks that assertion merge green, and the next code pull
# request fails on prose it never touched.
#
# Four markdown files are read, and every one of them is code:
#
#   README.md      embeds the consumer workflow templates action.test.js
#                  pins the installed workflows to (CLAUDE.md is AGENTS.md
#   AGENTS.md      by symlink, so it carries the same content and the same
#   CLAUDE.md      verdict) — AGENTS.md also carries the consumer list the
#                  suite derives the check-consumers sweep from
#   docs/CONSUMER.md  the consumer contract: action.test.js pins the fork
#                  limitation, the head's-check limitation, the dispatch
#                  trigger's reason, and the template-migration section
#   TODO.md        the "Decisions needing review" heading the autopilot rule
#                  in AGENTS.md requires, asserted against the file itself
#
# These are named rather than covered by a tree rule, which is the honest
# shape here — the suite reads each by name. The list is hand-written, so it
# CAN go stale: a test that starts asserting against some other markdown
# file needs a rule added here, and nothing enforces that. Deriving the set
# by scanning the suite was tried and abandoned as more machinery than the
# problem is worth; lanes-policy.test.js pins these five instead.
#
# Everything that is not markdown is code, including action.yml (the
# manifest IS the action), every .mjs file (what consumers execute), the
# workflows, and .gitignore.
code README.md
code AGENTS.md
code CLAUDE.md
code TODO.md
code docs/CONSUMER.md
docs **/*.md

# The one subject prefix the docs lane accepts. The wider housekeeping table
# in AGENTS.md (test:, build:, refactor:) names categories this lane can
# never actually admit, because every file it accepts is markdown: a commit
# that really was test, build, or refactor work would carry a non-markdown
# file and ride the code lane instead. Accepting those three would have the
# required gate blessing subjects that describe work the diff cannot contain.
prefixes docs

# ci.yml declares no workflow_dispatch trigger, so no dispatched run is
# legitimate here: a PR-less dispatch is refused on every ref.
dispatch-without-pr refuse
