name: CI

# Consumers track `@main` -- no tag, no SHA, deliberately, since bumping a pin
# in every repository is the cost centralizing was meant to remove. So this
# suite runs on the pull request, which is the only gate between a change and
# every consumer's merge gate: there is no release step afterwards to catch
# anything. The `push` run below re-checks the commit the merge produced.
on:
  push:
    branches: [main]
  pull_request:

# Nothing here writes to the repository.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      # The major the action manifest declares. They are pinned to each other
      # by action.test.js, so this cannot quietly test on a runtime the action
      # does not run on.
      - uses: actions/setup-node@v6
        with:
          node-version: '24'

      # No install step, because there is nothing to install. If this ever
      # needs one, action.test.js fails first -- a dependency here would mean
      # what runs on a consumer's runner is no longer what a reader reads.
      - name: Test
        run: node --test *.test.js
