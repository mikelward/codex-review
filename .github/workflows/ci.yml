name: CI

# Consumers track `@main` -- no tag, no SHA, deliberately, since bumping a pin
# in every repository is the cost centralizing was meant to remove. So this
# suite runs on the pull request, which is the only gate between a change and
# every consumer's merge gate: there is no release step afterwards to catch
# anything. The `push` run below re-checks the commit the merge produced.
on:
  push:
    branches: [main]
  pull_request:
    # `edited` is here because a retarget changes what the PR's diff is
    # measured against while the head — and any `gate` check run already
    # minted on it — stays put, so a base change must start a fresh run.
    # Title and body edits re-run the lane too, deliberately: a skipped
    # job would be worse, because GitHub counts a skipped required check
    # as satisfied, so skipping the gate on a "harmless" edit would let a
    # newer skipped run replace a red verdict on the same head.
    types: [opened, synchronize, reopened, edited]

# Nothing here writes to the repository. The docs lane's classify and gate
# steps read the PR's files and commits through the workflow token;
# read-only, and still nothing here can write.
permissions:
  contents: read
  pull-requests: read

jobs:
  # Decides whether the test job may skip: true only when every changed
  # file in the PR is housekeeping (markdown other than README.md — see
  # .github/lanes.conf for the rule; the engine is mikelward/lanes). Pushes
  # to main are always classified as code.
  classify:
    name: Classify the diff
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      docs_only: ${{ steps.lane.outputs.docs_only }}
      base_sha: ${{ steps.lane.outputs.base_sha }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: mikelward/lanes@main
        id: lane
        with:
          mode: classify
          pr: ${{ github.event.pull_request.number }}

  test:
    runs-on: ubuntu-latest
    needs: classify
    if: needs.classify.outputs.docs_only != 'true'
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      # The major the action manifest declares. They are pinned to each other
      # by action.test.js, so this cannot quietly test on a runtime the action
      # does not run on.
      - uses: actions/setup-node@v6
        with:
          node-version: '24'

      # No install step, because there is nothing to install. If this ever
      # needs one, action.test.js fails first -- a dependency here would mean
      # what runs on a consumer's runner is no longer what a reader reads.
      - name: Test
        run: node --test *.test.js

      # The consumer check is Python, so its suite is too -- stdlib unittest,
      # no packages, in a repository that ships no dependencies. PyYAML comes
      # from the runner image and is deliberately NOT installed here: see
      # check-consumer.yml for why, and this step passing is the evidence
      # that the image supplies it.
      - name: Test the consumer check
        run: python3 -m unittest check_consumer_test -v

      # This repository is a consumer of itself, so the check runs against its
      # own tree -- from THIS revision, not from `@main`. Calling the reusable
      # workflow the way a consumer does would check out the released checker
      # and templates instead, so a pull request changing either would be
      # validated against the previous release and never exercise its own
      # change.
      - name: Check this repository's own setup
        run: python3 check_consumer.py .

      # And against real consumer trees, because `templates/` and
      # check_consumer.py are what nine repositories are held to, and consumers
      # track `@main`: a merge here reaches their merge gates with no release
      # step in between. Without this, a template change first meets a real
      # consumer after it can no longer be stopped.
      - name: Check the consumers
        run: scripts/check-consumers.sh

      - name: Shellcheck the scripts
        run: shellcheck -s sh -S error scripts/check-consumers.sh

  # The one check the main ruleset requires. Always runs, always reports —
  # green only when the test job succeeded, or when it was skipped and the
  # skip is INDEPENDENTLY verified as justified: the diff re-derived as
  # housekeeping-only and every commit subject carrying a housekeeping
  # prefix. Any other combination is an explicit red, never a silent pass.
  gate:
    name: gate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [classify, test]
    if: always()
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: mikelward/lanes@main
        with:
          mode: gate
          pr: ${{ github.event.pull_request.number }}
          classify-result: ${{ needs.classify.result }}
          # Only read on a dispatched run, and harmless on a pull_request one,
          # which takes the same commit from its own event payload.
          base-sha: ${{ needs.classify.outputs.base_sha }}
          results: >-
            test=${{ needs.test.result }}
