name: check-consumer

# The consumer-side check, as a reusable workflow so there is one copy of it.
#
# A consumer calls this from an eight-line `codex-review-check.yml` of its own
# (pinned by check_consumer.py, so a repository cannot quietly stop running
# it). Everything the check knows -- the workflow pair's exact contents, the
# sole-writer rule, which permissions notations it refuses to guess at -- lives
# in check_consumer.py here, tested by check_consumer_test.py here.
#
# It used to live as a hand-written test in each of the nine consumers, in four
# languages. Two review findings days apart, against two different copies,
# established what that costs: a fix had to be hand-carried into eight other
# files, and until it was, eight repositories had the hole. One implementation
# means one bug at a time rather than nine different ones, and one fix.
#
# `workflow_call` rather than a composite action because two consumers have no
# CI workflow at all to add a step to, and a reusable workflow is the form that
# serves both.
#
# The check is Python because the one thing it cannot do by comparison -- read
# a consumer's own ci.yml and answer whether any job can write commit statuses
# -- needs a real YAML parser. PyYAML is taken from the runner image, not
# installed: this repository has no package.json, no lockfile, no install
# step, and nothing is fetched while a consumer's merge gate is waiting.
# See the step below for what that trades away and why it is the safe side.

on:
  workflow_call:

# Reads the caller's tree and nothing else. The check writes nothing anywhere:
# it reports, and its exit status is the signal.
permissions:
  contents: read

jobs:
  # Named to match the caller's job id, not left as a generic `check`: GitHub
  # reports a reusable-workflow job's required-status context as
  # `<calling job> / <called job>`, so a generic id on either side makes the
  # branch-protection search box show an ambiguous "check / check" rather
  # than something a consumer can find by searching this action's own name.
  codex-review-check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # The caller's repository, at the revision under review.
      #
      # The caller's own trigger is `pull_request_target` rather than
      # `pull_request`: for a PR that edits `codex-review-check.yml` itself, a
      # bare `pull_request` would load the JOB DEFINITION from the PR's merge
      # ref, so the PR could replace the call to this reusable workflow with a
      # local job that always succeeds and merge past a red or deleted check.
      # `pull_request_target` loads the definition from the default branch, so
      # the workflow that runs is never the one a PR supplies.
      #
      # That flips `actions/checkout`'s default the other way: under
      # `pull_request_target` it checks out the BASE ref, not the PR's head,
      # which would validate the old files and never see what the PR changes.
      # The fix is the opposite of the usual `pull_request_target` caution --
      # this step checks out the untrusted head explicitly, but only ever
      # reads it as data (`check_consumer.py` parses text, nothing here
      # executes anything from the caller's tree), which is what makes doing
      # so safe. `github.sha` covers `push`, the other trigger this runs on.
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      # This repository, for the checker itself. `@main` matches how consumers
      # reference the action: there is no release step here, so a merge is live
      # on the next run either way, and a second pin would be a second thing to
      # bump in nine places.
      - uses: actions/checkout@v5
        with:
          repository: mikelward/codex-review
          ref: main
          path: .codex-review
          persist-credentials: false

      # No install step, deliberately. PyYAML is taken from the runner image
      # the way python3, git and bash are -- nothing is fetched at gate time.
      #
      # Installing it explicitly was tried and reverted. It put PyPI on the
      # critical path of nine repositories' merge gates, so a registry
      # outage stalls every consumer, and an unpinned `pip install` takes
      # whatever release is newest, so a parser regression could change a
      # verdict with no change in any repository. Pinning instead trades
      # that for a version to bump in lockstep -- the maintenance cost
      # centralizing this was meant to remove.
      #
      # The risk this leaves is the image dropping PyYAML, and it fails
      # CLOSED: check_consumer.py catches the ImportError and exits non-zero
      # with the reason, so the gate goes red and says why. Loud and
      # recoverable beats a dependency that can go wrong quietly.
      - name: Check the consumer's codex-review setup
        run: python3 .codex-review/check_consumer.py .
