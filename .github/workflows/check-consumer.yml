name: check-consumer

# The consumer-side check, as a reusable workflow so there is one copy of it.
#
# A consumer calls this from an eight-line `codex-review-check.yml` of its own
# (pinned by check_consumer.py, so a repository cannot quietly stop running
# it). Everything the check knows -- the workflow pair's exact contents, the
# sole-writer rule, which permissions notations it refuses to guess at -- lives
# in check_consumer.py here, tested by check_consumer_test.py here.
#
# It used to live as a hand-written test in each of the nine consumers, in four
# languages. Two review findings days apart, against two different copies,
# established what that costs: a fix had to be hand-carried into eight other
# files, and until it was, eight repositories had the hole. One implementation
# means one bug at a time rather than nine different ones, and one fix.
#
# `workflow_call` rather than a composite action because two consumers have no
# CI workflow at all to add a step to, and a reusable workflow is the form that
# serves both.
#
# The check is Python because the one thing it cannot do by comparison -- read
# a consumer's own ci.yml and answer whether any job can write commit statuses
# -- needs a real YAML parser, and the runner ships PyYAML. That is not a
# dependency taken on: this repository still has no package.json, no lockfile
# and no install step, which is what lets a consumer trust an unpinned `@main`
# by reading the files.

on:
  workflow_call:

# Reads the caller's tree and nothing else. The check writes nothing anywhere:
# it reports, and its exit status is the signal.
permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # The caller's repository. In a reusable workflow this is what
      # `actions/checkout` takes by default.
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      # This repository, for the checker itself. `@main` matches how consumers
      # reference the action: there is no release step here, so a merge is live
      # on the next run either way, and a second pin would be a second thing to
      # bump in nine places.
      - uses: actions/checkout@v5
        with:
          repository: mikelward/codex-review
          ref: main
          path: .codex-review
          persist-credentials: false

      # No install step, because there is nothing to install: python3 and
      # PyYAML are both on the runner image.
      - name: Check the consumer's codex-review setup
        run: python3 .codex-review/check_consumer.py .
